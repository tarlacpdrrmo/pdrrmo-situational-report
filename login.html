<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDRRMO | Secure Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --bg-body: #F2F2F7; --bg-card: #FFFFFF; 
            --text-main: #1C1C1E; --text-muted: #86868B; 
            --accent-blue: #007AFF; --accent-red: #FF3B30; 
            --border-subtle: #D1D1D6; --input-border: #C7C7CC;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius-lg: 14px; --radius-md: 10px;
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            font-family: var(--font-stack); 
            background-color: var(--bg-body); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            justify-content: center; 
            align-items: center; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }

        .login-card { 
            background: var(--bg-card); 
            padding: 40px 45px; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border-subtle); 
            box-shadow: var(--shadow-soft); 
            width: 100%; 
            max-width: 340px; 
            text-align: center; 
        }

        .icon-container {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.25);
        }

        .login-card i.fa-shield-halved { 
            font-size: 32px; 
            color: #ffffff; 
        }

        .login-card h2 { 
            margin: 0 0 6px 0; 
            font-size: 22px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
        }

        .login-card p { 
            margin: 0 0 30px 0; 
            font-size: 13px; 
            color: var(--text-muted); 
            font-weight: 500;
        }

        .form-group { 
            display: flex; 
            flex-direction: column; 
            text-align: left; 
            margin-bottom: 18px; 
        }

        .form-group label { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            margin-bottom: 8px; 
        }

        .form-group input { 
            padding: 12px 15px; 
            border: 1px solid var(--input-border); 
            border-radius: var(--radius-md); 
            background: #ffffff; 
            color: var(--text-main); 
            font-family: var(--font-stack); 
            font-size: 14px; 
            font-weight: 500;
            outline: none; 
            transition: all 0.2s ease; 
        }

        .form-group input::placeholder {
            color: #AEAEB2;
            font-weight: 400;
        }

        .form-group input:focus { 
            border-color: var(--accent-blue); 
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15); 
        }

        .login-btn { 
            background: var(--accent-blue); 
            color: #ffffff; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: var(--radius-md); 
            font-family: var(--font-stack);
            font-weight: 600; 
            font-size: 14px; 
            cursor: pointer; 
            transition: 0.2s; 
            margin-top: 10px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px; 
        }

        .login-btn:hover { 
            background: #0056B3; 
            transform: scale(0.98);
        }

        .error-msg { 
            color: var(--accent-red); 
            font-size: 13px; 
            font-weight: 500;
            margin-top: 15px; 
            display: none; 
            background: #FFEBEB; 
            padding: 12px; 
            border-radius: var(--radius-md); 
            border: 1px solid rgba(255, 59, 48, 0.2); 
        }

        .back-link { 
            display: inline-flex;
            align-items: center;
            gap: 6px; 
            margin-top: 25px; 
            color: var(--text-muted); 
            font-size: 12px; 
            font-weight: 600;
            text-decoration: none; 
            transition: 0.2s; 
        }

        .back-link:hover { 
            color: var(--accent-blue); 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-container">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>Restricted Access</h2>
        <p>PDRRMO Operational Workspace</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Authorized Email</label>
                <input type="email" id="email" required placeholder="admin@pdrrmo.gov.ph">
            </div>
            <div class="form-group">
                <label>Security Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn" id="submitBtn"><i class="fa-solid fa-right-to-bracket"></i> Authenticate</button>
            <div class="error-msg" id="errorMsg"><i class="fa-solid fa-circle-exclamation"></i> Invalid credentials.</div>
        </form>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Dashboard</a>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAsvM0PXXWCjqGBiEdRiuBsCCiR1bm_4gk",
        authDomain: "tarlac-sitrep-backend-5000e.firebaseapp.com",
        projectId: "tarlac-sitrep-backend-5000e",
        storageBucket: "tarlac-sitrep-backend-5000e.firebasestorage.app",
        messagingSenderId: "575825350427",
        appId: "1:575825350427:web:d4e336b580e44a29900dbe"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // DYNAMIC ROUTER: Reads the URL to check for a specific redirect target
    const urlParams = new URLSearchParams(window.location.search);
    const redirectTarget = urlParams.get('redirect') || 'data_entry.html';

    // If already logged in, redirect immediately to the target
    onAuthStateChanged(auth, (user) => {
        if (user) { window.location.href = redirectTarget; }
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submitBtn');
        const err = document.getElementById('errorMsg');

        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';
        btn.disabled = true;
        err.style.display = 'none';

        signInWithEmailAndPassword(auth, email, password)
            .then(() => { 
                // Sends the user to their intended destination instead of forcing data_entry.html
                window.location.href = redirectTarget; 
            })
            .catch((error) => {
                err.style.display = 'block';
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Authenticate';
                btn.disabled = false;
            });
    });
</script>
</body>
</html>
